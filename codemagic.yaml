workflows:
  flappy-bird-deb-ipa:
    name: FlappyBird - deb + ipa
    max_build_duration: 30
    environment:
      xcode: 16.2
      vars:
        BUNDLE_ID: "com.aiwolfie.flappybird"
        APP_NAME: "FlappyBird"

    scripts:
      - name: Araçları kur
        script: |
          brew install ldid dpkg

      - name: Build
        script: |
          mkdir -p build
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          swiftc \
            FlappyBird/AppDelegate.swift \
            FlappyBird/GameViewController.swift \
            FlappyBird/GameScene.swift \
            -sdk $SDK \
            -target arm64-apple-ios14.0 \
            -framework UIKit \
            -framework SpriteKit \
            -framework AudioToolbox \
            -module-name FlappyBird \
            -parse-as-library \
            -o build/FlappyBird_arm64

          swiftc \
            FlappyBird/AppDelegate.swift \
            FlappyBird/GameViewController.swift \
            FlappyBird/GameScene.swift \
            -sdk $SDK \
            -target arm64e-apple-ios14.0 \
            -framework UIKit \
            -framework SpriteKit \
            -framework AudioToolbox \
            -module-name FlappyBird \
            -parse-as-library \
            -o build/FlappyBird_arm64e

          lipo -create build/FlappyBird_arm64 build/FlappyBird_arm64e \
            -output build/FlappyBird

      - name: .app bundle
        script: |
          mkdir -p package/Applications/FlappyBird.app
          cp build/FlappyBird package/Applications/FlappyBird.app/
          cp FlappyBird/Info.plist package/Applications/FlappyBird.app/
          chmod 755 package/Applications/FlappyBird.app/FlappyBird
          ldid -SFlappyBird/FlappyBird.entitlements \
            package/Applications/FlappyBird.app/FlappyBird

      - name: deb
        script: |
          dpkg-deb -Zgzip --build package \
            FlappyBird_1.0_iphoneos-arm64.deb

      - name: ipa
        script: |
          mkdir -p ipa_stage/Payload
          cp -r package/Applications/FlappyBird.app ipa_stage/Payload/
          cd ipa_stage && zip -r ../FlappyBird.ipa Payload/

    artifacts:
      - FlappyBird_1.0_iphoneos-arm64.deb
      - FlappyBird.ipa
